name: Manual Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-build-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Sync version
        shell: pwsh
        run: .\scripts\sync_version.ps1

      - name: Build release executables
        shell: pwsh
        run: .\build_dual.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "Using ISCC: $iscc"
          & $iscc installer\SSHDriveMgr.iss

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-executables
          path: |
            dist/SSHDriveMgr.exe
            dist/SSHDriveMgr-cli.exe
            dist_installer/*.exe
          if-no-files-found: error

      - name: Upload assets to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if (-not $env:RELEASE_TAG) {
            throw 'No release tag was provided by the event payload.'
          }

          $installer = Get-ChildItem dist_installer\*.exe | Select-Object -First 1 -ExpandProperty FullName

          # sha256sums.txt lets the in-app updater verify the installer it
          # downloads (src/updater.py looks for exactly this asset name).
          $files = @('.\dist\SSHDriveMgr.exe', '.\dist\SSHDriveMgr-cli.exe', $installer)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $([System.IO.Path]::GetFileName($f))"
          }
          $lines | Out-File -FilePath sha256sums.txt -Encoding ascii

          gh release upload $env:RELEASE_TAG .\dist\SSHDriveMgr.exe .\dist\SSHDriveMgr-cli.exe $installer .\sha256sums.txt --repo $env:GITHUB_REPOSITORY --clobber
