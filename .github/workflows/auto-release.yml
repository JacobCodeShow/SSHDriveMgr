name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Sync version
        shell: powershell
        run: .\scripts\sync_version.ps1

      - name: Build executables
        shell: powershell
        run: .\build_dual.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== dist/ contents ==="
          Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name): $([math]::Round($_.Length/1MB, 2)) MB" }
          if (-not (Test-Path dist/SSHDriveMgr.exe)) { throw "SSHDriveMgr.exe not found!" }
          if (-not (Test-Path dist/SSHDriveMgr-cli.exe)) { throw "SSHDriveMgr-cli.exe not found!" }
          Write-Host "Build output verified."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          Write-Host "=== Inno Setup locations ==="
          Get-ChildItem "C:\Program Files*\Inno Setup 6" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "Using ISCC: $iscc"
          Write-Host "=== Languages available ==="
          Get-ChildItem (Split-Path $iscc)\Languages -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          & $iscc ".\installer\SSHDriveMgr.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Write-Host "=== Installer output ==="
          Get-ChildItem dist_installer -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name): $([math]::Round($_.Length/1MB, 2)) MB" }

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SSHDriveMgr.exe
            dist/SSHDriveMgr-cli.exe
            dist_installer/SSHDriveMgr-Setup-*.exe
