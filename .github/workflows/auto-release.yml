name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Sync version
        shell: powershell
        run: .\scripts\sync_version.ps1

      - name: Build executables
        shell: powershell
        run: .\build_dual.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "Using ISCC: $iscc"
          & $iscc ".\installer\SSHDriveMgr.iss"

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SSHDriveMgr.exe
            dist/SSHDriveMgr-cli.exe
            dist_installer/SSHDriveMgr-Setup-*.exe
