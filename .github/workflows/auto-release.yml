name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Sync version
        shell: powershell
        run: .\scripts\sync_version.ps1

      - name: Build executables
        shell: powershell
        run: .\build_dual.ps1 -OneDir

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== dist/ contents ==="
          Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name): $([math]::Round($_.Length/1MB, 2)) MB" }
          if (-not (Test-Path dist/SSHDriveMgr.exe)) { throw "SSHDriveMgr.exe not found!" }
          if (-not (Test-Path dist/SSHDriveMgr-cli.exe)) { throw "SSHDriveMgr-cli.exe not found!" }
          if (-not (Test-Path dist/SSHDriveMgr-onedir/SSHDriveMgr.exe)) { throw "SSHDriveMgr-onedir not found!" }
          Write-Host "Build output verified."

      - name: Package onedir build as zip
        shell: pwsh
        run: |
          $version = (Get-Content src/version.txt -Raw).Trim()
          $zip = "dist/SSHDriveMgr-onedir-$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # -Path ".../*" zips the folder CONTENTS at the archive root, so
          # extracting produces SSHDriveMgr.exe + _internal\ directly.
          Compress-Archive -Path "dist/SSHDriveMgr-onedir/*" -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length/1MB, 1)
          Write-Host "Created $zip ($mb MB)"
          echo "ONEDIR_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          Write-Host "=== Running ISCC ==="
          & $iscc ".\installer\SSHDriveMgr.iss" 2>&1 | Tee-Object -FilePath iscc_log.txt
          $exitCode = $LASTEXITCODE
          Write-Host "=== ISCC exit code: $exitCode ==="
          if ($exitCode -ne 0) {
            Write-Host "=== ISCC full log ==="
            Get-Content iscc_log.txt -ErrorAction SilentlyContinue
            throw "ISCC failed with exit code $exitCode"
          }
          Write-Host "=== Installer output ==="
          Get-ChildItem dist_installer -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name): $([math]::Round($_.Length/1MB, 2)) MB" }

      - name: Generate sha256sums
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist_installer\*.exe | Select-Object -First 1 -ExpandProperty FullName
          $files = @('.\dist\SSHDriveMgr.exe', '.\dist\SSHDriveMgr-cli.exe', $env:ONEDIR_ZIP, $installer)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $([System.IO.Path]::GetFileName($f))"
          }
          $lines | Out-File -FilePath sha256sums.txt -Encoding ascii
          Write-Host "=== sha256sums.txt ==="
          Get-Content sha256sums.txt

      - name: Create Release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem dist_installer\*.exe | Select-Object -First 1 -ExpandProperty FullName

          # Create release if not exists, otherwise get existing
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if (-not $release) {
            Write-Host "Creating release $tag..."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          } else {
            Write-Host "Release $tag already exists, uploading assets..."
          }

          # Upload assets one by one (more stable than bulk upload)
          $assets = @(
            @{ Path = ".\dist\SSHDriveMgr.exe"; Name = "SSHDriveMgr.exe" },
            @{ Path = ".\dist\SSHDriveMgr-cli.exe"; Name = "SSHDriveMgr-cli.exe" },
            @{ Path = $env:ONEDIR_ZIP; Name = (Split-Path $env:ONEDIR_ZIP -Leaf) },
            @{ Path = $installer; Name = (Split-Path $installer -Leaf) },
            @{ Path = ".\sha256sums.txt"; Name = "sha256sums.txt" }
          )

          foreach ($asset in $assets) {
            Write-Host "Uploading $($asset.Name)..."
            gh release upload $tag $asset.Path --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Retry uploading $($asset.Name)..."
              Start-Sleep -Seconds 5
              gh release upload $tag $asset.Path --repo $env:GITHUB_REPOSITORY --clobber
            }
          }

          Write-Host "All assets uploaded successfully."

          # Ensure release is published (not draft)
          Write-Host "Publishing release..."
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
